name: RIDE CPU flow acceptance (9450)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ride-9450-workspace
  cancel-in-progress: false
jobs:
  contracts:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, ride-9450]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installed package contract tests on 9450
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m venv "$RUNNER_TEMP/ride-contract-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/ride-contract-$GITHUB_RUN_ID/bin/python" -m pip install . > evidence/install.log 2>&1
          "$RUNNER_TEMP/ride-contract-$GITHUB_RUN_ID/bin/python" -m unittest discover -s tests -v > evidence/tests.log 2>&1
      - name: Real Ray and Controller flow with Mock vLLM, no accelerator
        env:
          RIDE_DEPLOYMENT: /workspace/home/ride-platform-v02-20261010/ci-deployment.json
        run: python scripts/cloud_cpu_workflow.py --deployment "$RIDE_DEPLOYMENT" --output evidence/cpu-flow --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-contract-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
