[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ride-control-plane"
version = "0.1.0"
requires-python = ">=3.10"
description = "RIDE inference control plane"
[project.scripts]
ride = "ride.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ride = ["index.html"]
