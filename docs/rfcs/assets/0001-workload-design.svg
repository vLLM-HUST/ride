    <polyline points="360,190.0 430,190.0" fill="none" stroke="#596153" stroke-width="1.5" marker-end="url(#arrow-596153)" />
  </g>
  <g id="edge-short-work-target" class="semantic-cell semantic-edge" data-semantic-id="short-work-target">
    <title>short-work to short-target</title>
    <polyline points="730,190.0 800,190.0" fill="none" stroke="#b7492c" stroke-width="1.5" marker-end="url(#arrow-b7492c)" />
  </g>
  <g id="edge-long-count-work" class="semantic-cell semantic-edge" data-semantic-id="long-count-work">
