    <polyline points="360,370.0 430,370.0" fill="none" stroke="#596153" stroke-width="1.5" marker-end="url(#arrow-596153)" />
  </g>
  <g id="edge-long-work-target" class="semantic-cell semantic-edge" data-semantic-id="long-work-target">
    <title>long-work to long-target</title>
    <polyline points="730,370.0 800,370.0" fill="none" stroke="#b7492c" stroke-width="1.5" marker-end="url(#arrow-b7492c)" />
  </g>
  <g id="node-title" class="semantic-cell semantic-node" data-semantic-id="title">
    <title>图 2 · 请求数相同，容量需求可能不同</title>
    <rect x="60" y="10" width="1040" height="80" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    <text x="580.0" y="43.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">图 2 · 请求数相同，容量需求可能不同</text>
    <text x="580.0" y="63.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">假设算例：仅改变输入长度，不含 decode 与缓存差异</text>
  </g>
  <g id="node-short-input" class="semantic-cell semantic-node" data-semantic-id="short-input">
    <title>12 个短输入请求</title>
    <rect x="60" y="140" width="300" height="100" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="210.0" y="183.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">12 个短输入请求</text>
    <text x="210.0" y="203.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">每个 1,000 token</text>
  </g>
  <g id="node-short-work" class="semantic-cell semantic-node" data-semantic-id="short-work">
    <title>预算 B = 12,000 token</title>
    <rect x="430" y="140" width="300" height="100" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="580.0" y="183.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">预算 B = 12,000 token</text>
    <text x="580.0" y="203.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">12 × 1,000</text>
  </g>
  <g id="node-short-target" class="semantic-cell semantic-node" data-semantic-id="short-target">
    <title>prefill 建议 = 1 个实例</title>
    <rect x="800" y="140" width="300" height="100" rx="0" fill="#fff6ed" stroke="#b7492c" stroke-width="2" />
    <text x="950.0" y="183.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">prefill 建议 = 1 个实例</text>
    <text x="950.0" y="203.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">ceil(12,000 / 4,000 / 10)</text>
  </g>
  <g id="node-long-input" class="semantic-cell semantic-node" data-semantic-id="long-input">
    <title>12 个长输入请求</title>
    <rect x="60" y="320" width="300" height="100" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="210.0" y="363.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">12 个长输入请求</text>
    <text x="210.0" y="383.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">每个 10,000 token</text>
  </g>
  <g id="node-long-work" class="semantic-cell semantic-node" data-semantic-id="long-work">
    <title>预算 B = 120,000 token</title>
    <rect x="430" y="320" width="300" height="100" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="580.0" y="363.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">预算 B = 120,000 token</text>
    <text x="580.0" y="383.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">12 × 10,000</text>
  </g>
  <g id="node-long-target" class="semantic-cell semantic-node" data-semantic-id="long-target">
    <title>prefill 建议 = 3 个实例</title>
    <rect x="800" y="320" width="300" height="100" rx="0" fill="#fff6ed" stroke="#b7492c" stroke-width="2" />
    <text x="950.0" y="363.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">prefill 建议 = 3 个实例</text>
    <text x="950.0" y="383.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">ceil(120,000 / 4,000 / 10)</text>
  </g>
  <g id="node-assumptions" class="semantic-cell semantic-node" data-semantic-id="assumptions">
    <title>共同假设：C_prefill = 4,000 token/s；W_queue = 10 s</title>
    <rect x="60" y="485" width="1040" height="70" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    <text x="580.0" y="513.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">共同假设：C_prefill = 4,000 token/s；W_queue = 10 s</text>
    <text x="580.0" y="533.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">同一模型 / 路径 / 口径的有效转换率；数字未实测、未用于冻结参数</text>
  </g>
  <g id="node-meaning" class="semantic-cell semantic-node" data-semantic-id="meaning">
    <title>优化点：容量随工作量变化，而不是只随请求个数变化</title>
    <rect x="60" y="575" width="1040" height="70" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    <text x="580.0" y="603.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">优化点：容量随工作量变化，而不是只随请求个数变化</text>
    <text x="580.0" y="623.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">这里只计算 prefill 分支；最终目标还须取 KV、预测及配置下限的最大值</text>
  </g>
</svg>