    <text x="970.0" y="670.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">扩缩互斥；受理不等于生效</text>
  </g>
  <g id="node-verify" class="semantic-cell semantic-node" data-semantic-id="verify">
    <title>④ Verify · 验证</title>
    <rect x="1200" y="235" width="300" height="80" rx="0" fill="#fff6ed" stroke="#b7492c" stroke-width="2" />
    <text x="1350.0" y="268.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">④ Verify · 验证</text>
    <text x="1350.0" y="288.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">检查动作和效果，反馈下一轮</text>
  </g>
  <g id="node-receipt" class="semantic-cell semantic-node" data-semantic-id="receipt">
