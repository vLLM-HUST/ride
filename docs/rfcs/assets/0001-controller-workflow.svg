    <rect x="1200" y="350" width="300" height="95" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="1350.0" y="390.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">核 Job 与动作回执</text>
    <text x="1350.0" y="410.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">启动、激活、停止分别查实际状态</text>
  </g>
  <g id="node-effect" class="semantic-cell semantic-node" data-semantic-id="effect">
