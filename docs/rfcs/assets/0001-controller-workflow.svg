    <text x="1350.0" y="520.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">核业务与资源效果</text>
    <text x="1350.0" y="540.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">新增实例承接 / 排队 / TTFT / 释放</text>
  </g>
  <g id="node-feedback" class="semantic-cell semantic-node" data-semantic-id="feedback">
    <title>输出：实际结果与诊断证据</title>
    <rect x="1200" y="610" width="300" height="95" rx="0" fill="#ffffff" stroke="#454b43" stroke-width="2" />
    <text x="1350.0" y="650.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">输出：实际结果与诊断证据</text>
    <text x="1350.0" y="670.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">反馈下一轮；UNKNOWN 查原操作</text>
  </g>
  <g id="node-example" class="semantic-cell semantic-node" data-semantic-id="example">
    <title>同一快照的决策例子：prefill 需 3、KV 需 2、预测需 2 → 目标 3</title>
    <rect x="60" y="845" width="1440" height="80" rx="0" fill="#fff6ed" stroke="#ffffff" stroke-width="2" />
    <text x="780.0" y="878.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">同一快照的决策例子：prefill 需 3、KV 需 2、预测需 2 → 目标 3</text>
    <text x="780.0" y="898.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">2 Ready：启动 1；2 Ready + 1 starting：不重复启动</text>
  </g>
  <g id="node-boundary" class="semantic-cell semantic-node" data-semantic-id="boundary">
    <title>接口边界：Instance → ride.sdk → RIDE → Ray / vLLM；Request / KV 通过各自 API 协同</title>
    <rect x="60" y="950" width="1440" height="80" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    <text x="780.0" y="983.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">接口边界：Instance → ride.sdk → RIDE → Ray / vLLM；Request / KV 通过各自 API 协同</text>
    <text x="780.0" y="1003.0" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">本期复用已有 Ray 资源池；云平台扩节点为后续后端能力，尚未实现</text>
  </g>
  <g id="node-measurement" class="semantic-cell semantic-node" data-semantic-id="measurement">
