    <text x="970.0" y="520.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">按建议调用扩或缩接口</text>
    <text x="970.0" y="540.5" fill="#242822" font-family="PingFang SC, Arial, sans-serif" font-size="13" text-anchor="middle">RIDE 启停 / Request-KV 排空</text>
  </g>
  <g id="node-drain" class="semantic-cell semantic-node" data-semantic-id="drain">
