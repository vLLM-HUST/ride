<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>RIDE 控制平面</title><style>body{font-family:system-ui;background:#101722;color:#e5edf7;max-width:1000px;margin:60px auto;padding:24px}h1{font-size:44px}button{padding:12px;background:#74dfc1;border:0;border-radius:6px}pre{white-space:pre-wrap;background:#1c293a;padding:20px}article{border:1px solid #39516e;padding:20px;margin:16px 0}small{color:#aabbcc}</style>
<h1>RIDE</h1><p>可组合的推理系统控制平面</p><small>当前为只读部署原型。页面不提供尚未实现的启动或禁用操作。</small>
<p><button id="refresh">刷新真实状态</button> <span id="timestamp"></span></p><div id="controllers"></div><pre id="status">读取中…</pre>
<script>async function refresh(){try{const r=await fetch('api/v1/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();document.getElementById('timestamp').textContent=s.observed_at;const root=document.getElementById('controllers');root.replaceChildren();if(!s.controllers.length){const p=document.createElement('p');p.textContent='尚未接入 controller：不能据此宣称 controller 已运行。';root.append(p)}for(const c of s.controllers){const a=document.createElement('article');a.textContent=c.id+' · '+c.state+' · '+c.endpoint;root.append(a)}document.getElementById('status').textContent=JSON.stringify(s,null,2)}catch(e){document.getElementById('status').textContent='状态读取失败：'+e.message}}document.getElementById('refresh').onclick=refresh;refresh();</script></html>
