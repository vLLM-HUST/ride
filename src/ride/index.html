<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RIDE · 工作区控制平面</title>
<style>body{font-family:system-ui;background:#101722;color:#e5edf7;max-width:1100px;margin:40px auto;padding:24px}h1{font-size:44px;margin-bottom:0}button{padding:10px 18px;background:#74dfc1;border:0;border-radius:6px;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c293a;padding:20px}article{border:1px solid #39516e;border-radius:12px;padding:24px;margin:24px 0}small,.muted{color:#aabbcc}.metrics{display:flex;gap:35px;flex-wrap:wrap;margin:24px 0}.metrics strong{font-size:30px;display:block}.success{color:#74dfc1}.warning{color:#ffc979}td,th{text-align:left;padding:10px;border-bottom:1px solid #39516e}table{width:100%}</style>
<h1>RIDE</h1><p>工作区内的推理系统控制平面</p><p id="workspace"></p><small>启动和停止仅操作本实例创建的 controller 作业。停止 controller 不停止引擎。</small>
<p><button id="refresh">刷新状态</button> <span id="timestamp"></span></p><p id="message" role="status"></p><div id="controllers"></div>
<h2>操作记录</h2><table><thead><tr><th>时间</th><th>操作</th><th>结果</th></tr></thead><tbody id="operations"></tbody></table>
<details><summary>运行身份与诊断详情</summary><pre id="status"></pre></details>
<script>
const el=id=>document.getElementById(id);const append=(root,tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;root.append(n);return n};
async function action(id,verb){el('message').textContent='正在提交操作…';try{const r=await fetch('api/v1/controllers/'+encodeURIComponent(id)+'/'+verb,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();el('message').textContent=(verb==='start'?'已提交启动':'已请求停止')+'，等待实际状态更新。';await refresh()}catch(e){el('message').textContent='操作失败：'+e.message}}
async function refresh(){try{const r=await fetch('api/v1/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();el('timestamp').textContent='更新于 '+new Date(s.observed_at).toLocaleString();el('workspace').textContent='所属工作区：'+s.workspace;const root=el('controllers');root.replaceChildren();for(const c of s.controllers){const a=append(root,'article','');append(a,'h2','Request Throttling Controller');append(a,'p',c.ready?'已就绪 · 可接收请求':c.job_status==='RUNNING'?'运行中 · 等待就绪':c.job_status,c.ready?'success':'warning');append(a,'p','引擎：'+c.backend);append(a,'p','请求入口：'+c.endpoint+'/v1');append(a,'p','调度：'+(c.identity?.scheduling_enabled?'已启用':'未确认')+' · 模型服务：'+(c.engine_ready?'可用':'未就绪'));const metrics=append(a,'div','','metrics');for(const [label,key]of [['运行 program','programs_count'],['Reasoning','reasoning_count'],['工具执行','acting_count'],['等待 program','paused_count']]){const cell=append(metrics,'div',label);append(cell,'strong',c.health?.[key]??'—')}append(a,'p','实际实现：'+(c.identity?.router_class||'尚未加载'),'muted');for(const verb of ['start','stop']){const b=append(a,'button',verb==='start'?'启动 controller':'停止 controller');b.disabled=verb==='start'?['RUNNING','PENDING'].includes(c.job_status):!['RUNNING','PENDING'].includes(c.job_status);b.onclick=()=>action(c.id,verb)}}el('operations').replaceChildren();for(const op of s.operations.slice().reverse()){const row=append(el('operations'),'tr','');append(row,'td',new Date(op.at).toLocaleTimeString());append(row,'td',op.action);append(row,'td',op.result)}el('status').textContent=JSON.stringify(s,null,2)}catch(e){el('message').textContent='状态不可用：'+e.message;el('controllers').replaceChildren()}}
el('refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></html>
