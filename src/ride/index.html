<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RIDE · 工作区控制平面</title>
<style>body{font-family:system-ui;background:#101722;color:#e5edf7;max-width:1150px;margin:30px auto;padding:24px}h1{font-size:44px;margin-bottom:0}button{padding:10px 18px;background:#74dfc1;border:0;border-radius:6px;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c293a;padding:20px}article{border:1px solid #39516e;border-radius:12px;padding:22px;margin:20px 0}small,.muted{color:#aabbcc}.success{color:#74dfc1}.warning{color:#ffc979}td,th{text-align:left;padding:10px;border-bottom:1px solid #39516e}table{width:100%}.layers{display:flex;gap:12px;flex-wrap:wrap}.layers span{padding:14px;background:#1c293a;border-radius:6px}input,select{padding:9px;margin:8px;color:#e5edf7;background:#1c293a;border:1px solid #39516e}label{display:inline-block}form{border:1px solid #39516e;padding:14px;border-radius:8px}</style>
<h1>RIDE</h1><p>工作区内的推理系统控制平面</p><p id="workspace"></p><div class="layers"><span>CLI / Web UI：管理入口</span><span>RIDE：部署与观测</span><span>Ray：运行 Controller 与 vLLM 进程</span></div>
<p><button id="refresh">刷新状态</button> <span id="timestamp"></span></p><p id="message" role="status"></p>
<details><summary>创建运行实例</summary><form id="create"><label>对象<select name="kind"><option value="controllers">Request Throttling Controller</option><option value="model-services">vLLM 模型服务</option></select></label><label>实例名<input name="name" required placeholder="throttle-main"></label><label>可达服务地址<input name="endpoint" required placeholder="http://worker-host:9000"></label><label>Controller 后端<input name="backend" placeholder="http://model-host:8000"></label><label>模型路径<input name="model" placeholder="/models/Qwen"></label><label>监听端口<input name="port" type="number" min="1" max="65535" required value="9000"></label><button>部署到 Ray</button><p class="muted">模型权重与依赖须已在运行环境中准备好。自定义加速卡资源与环境请通过 CLI 指定，不自动选择其他实验的资源。</p></form></details>
<h2>模型服务进程</h2><div id="models"></div><h2>Controller 进程</h2><div id="controllers"></div>
<h2>操作记录</h2><table><thead><tr><th>时间</th><th>对象</th><th>操作</th><th>结果</th></tr></thead><tbody id="operations"></tbody></table><details open><summary>进程日志</summary><pre id="logs">选择实例的“查看日志”。</pre></details><details><summary>运行身份与诊断详情</summary><pre id="status"></pre></details>
<script>
const el=id=>document.getElementById(id);const append=(root,tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;root.append(n);return n};
async function action(kind,id,verb,body={}){el('message').textContent='正在提交操作…';try{const r=await fetch('api/v1/'+kind+'/'+encodeURIComponent(id)+'/'+verb,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||'HTTP '+r.status);el('message').textContent=(verb==='start'?'已提交启动':'已请求停止')+'，实际状态以就绪检查为准。';await refresh()}catch(e){el('message').textContent='操作失败：'+e.message}}
async function logs(kind,id){try{const r=await fetch('api/v1/'+kind+'/'+encodeURIComponent(id)+'/logs');const v=await r.json();if(!r.ok)throw Error(v.error);el('logs').textContent=id+'\n'+v.logs}catch(e){el('logs').textContent='日志不可用：'+e.message}}
function render(root,records,kind){root.replaceChildren();if(!records.length)append(root,'p','尚未登记实例。','muted');for(const c of records){const a=append(root,'article','');append(a,'h3',c.id+' · '+c.type);append(a,'p',c.ready?'已就绪':c.job_status==='RUNNING'?'运行中 · 尚未就绪':c.job_status,c.ready?'success':'warning');append(a,'p','服务地址：'+c.endpoint);if(c.backend)append(a,'p','模型后端：'+c.backend);if(c.model)append(a,'p','模型：'+c.model);append(a,'p','Ray Job：'+(c.job_id||'未提交'),'muted');if(c.identity)append(a,'p','实际实现：'+c.identity.router_class+' · 调度：'+(c.identity.scheduling_enabled?'已启用':'未启用'));for(const verb of ['start','stop']){const b=append(a,'button',verb==='start'?'启动':'停止');b.disabled=verb==='start'?['RUNNING','PENDING'].includes(c.job_status):!['RUNNING','PENDING'].includes(c.job_status);b.onclick=()=>action(kind,c.id,verb)}const b=append(a,'button','查看日志');b.onclick=()=>logs(kind,c.id)}}
async function refresh(){try{const r=await fetch('api/v1/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();el('timestamp').textContent='更新于 '+new Date(s.observed_at).toLocaleString();el('workspace').textContent='所属工作区：'+s.workspace;render(el('models'),s.model_services||[],'model-services');render(el('controllers'),s.controllers||[],'controllers');el('operations').replaceChildren();for(const op of (s.operations||[]).slice().reverse()){const row=append(el('operations'),'tr','');for(const t of [new Date(op.at).toLocaleTimeString(),op.target,op.action,op.result])append(row,'td',t)}el('status').textContent=JSON.stringify(s,null,2)}catch(e){el('message').textContent='状态不可用：'+e.message;el('models').replaceChildren();el('controllers').replaceChildren()}}
el('create').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const body={type:v.kind==='controllers'?'request-throttling':'vllm',endpoint:v.endpoint,port:Number(v.port)};if(v.kind==='controllers'){body.backend=v.backend;body.listen='0.0.0.0:'+v.port}else body.model=v.model;action(v.kind,v.name,'start',body)};el('refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></html>
